[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copd-anomaly"
version = "0.1.0"
description = "Reproduction and lobe-wise exacerbation extension of cOOpD anomaly-based CT quantification for COPD (Almeida et al., 2024)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "TODO: To be determined pending CT-RATE (CC-BY-NC-SA) and DIR-Lab data redistribution review" }
authors = [
    { name = "COPD Anomaly Research Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.24.0,<3.0.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "scikit-learn>=1.3.0",
    "SimpleITK>=2.3.0",
    "nibabel>=5.1.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "huggingface-hub>=0.20.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "pydantic>=2.4.0",
    "lifelines>=0.28.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
    "mypy>=1.8.0",
]
segmentation = [
    # Optional backends; use explicit backend selection and inspect each generated mask.
    "lungmask>=0.2.16",
    "TotalSegmentator>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line length handled by formatter
    "B008", # Do not perform function calls in argument defaults (Hydra / click common)
]

[tool.ruff.lint.isort]
known-first-party = ["copd_anomaly"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --strict-markers"
env = [
    "OPENBLAS_NUM_THREADS=1",
    "OMP_NUM_THREADS=1",
    "MKL_NUM_THREADS=1",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "synthetic: tests running on synthetic data fixtures",
]

[tool.coverage.run]
source = ["src/copd_anomaly"]
omit = ["tests/*", "scripts/*"]
