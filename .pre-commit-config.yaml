repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: detect-hf-secrets
        name: Detect Hugging Face Tokens
        entry: 'hf_[A-Za-z0-9]{20,}'
        language: pygrep
        types: [text]
        exclude: '^(\.env\.example|\.pre-commit-config\.yaml)$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
