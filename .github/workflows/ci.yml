name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: One-time cleanup on remediation branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'remediation/phase0-safety-ci'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ruff check --fix . || true
          ruff format .
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "[ruff-autofix] Apply Ruff lint and formatting fixes"
            git push origin HEAD:refs/heads/remediation/phase0-safety-ci
          fi

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest with synthetic fixtures (CPU only, no network)
        run: |
          pytest tests/ -v --cov=src/copd_anomaly --cov-report=term-missing
