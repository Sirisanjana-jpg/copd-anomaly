name: One-time Ruff cleanup

on:
  push:
    branches: [remediation/phase0-safety-ci]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/phase0-safety-ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.6.0"
      - name: Apply safe lint fixes and formatting
        run: |
          ruff check --fix . || true
          ruff format .
      - name: Commit formatting changes to the remediation branch only
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "[ruff-autofix] Apply Ruff lint and formatting fixes"
            git push origin remediation/phase0-safety-ci
          else
            echo "No formatting changes needed."
          fi
