# 3D Contrastive Encoder Architecture & NT-Xent Training
backbone: "resnet18_3d"
in_channels: 1
latent_dim: 128
projection_dim: 64
temperature: 0.1
learning_rate: 0.0003
weight_decay: 0.0001
epochs: 100
warmup_epochs: 10
batch_size: 32
grad_clip: 1.0
collapse_threshold_std: 0.001
augmentations:
  random_flip_prob: 0.5
  jitter_scale: 0.1
  gaussian_blur_prob: 0.3
  random_crop_padding: 4
